services:
  db:
    image: postgres:16
    container_name: moonblogger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moonblogger}
      POSTGRES_USER: ${DB_USER:-moonblogger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Se requiere DB_PASSWORD (ver .env.example)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - moonblogger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moonblogger_pgdata:
