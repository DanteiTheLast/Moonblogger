# MoonBlogger — propiedades globales de Gradle.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Jetpack Compose requiere AndroidX.
android.useAndroidX=true

# Recursos R no transitivos: compila más rápido y evita colisiones de ids.
android.nonTransitiveRClass=true

# Cache de configuración de Gradle (recomendado por AGP 9).
org.gradle.configuration-cache=true
